<section
  id="about"
  class="relative py-20 md:py-28 px-4 sm:px-6
         bg-gray-50 dark:bg-gray-950 overflow-hidden"
>
  <div
    class="absolute -top-20 -left-20 w-72 h-72 bg-indigo-500/10 blur-3xl rounded-full"
    aria-hidden="true"
  ></div>

  <div class="relative max-w-5xl mx-auto">
    <div appScrollReveal>
      <app-section-header title="About " highlight="Me" />
    </div>

    <div class="grid lg:grid-cols-3 gap-8">
      <!-- Bio Card -->
      <div
        appScrollReveal
        [delay]="100"
        class="lg:col-span-2 bg-white/70 dark:bg-white/5 backdrop-blur-lg
               border border-gray-200/80 dark:border-white/10
               rounded-2xl p-6 sm:p-10 text-gray-600 dark:text-gray-300 leading-relaxed space-y-5"
      >
        @for (paragraph of paragraphs; track $index) {
          <p [class.text-lg]="$first">{{ paragraph }}</p>
        }
      </div>

      <!-- Sidebar -->
      <div class="space-y-6">
        <!-- Experience badge -->
        <div
          appScrollReveal
          [delay]="200"
          class="bg-white/70 dark:bg-white/5 backdrop-blur-lg
                 border border-gray-200/80 dark:border-white/10
                 rounded-2xl p-6 text-center"
        >
          <div
            class="text-5xl font-bold bg-gradient-to-r from-indigo-500 to-cyan-500 bg-clip-text text-transparent"
          >
            {{ personal.yearsOfExperience }}+
          </div>
          <p class="mt-2 text-gray-600 dark:text-gray-400 font-medium">Years of Experience</p>
        </div>

        <!-- Specializations -->
        <div
          appScrollReveal
          [delay]="300"
          class="bg-white/70 dark:bg-white/5 backdrop-blur-lg
                 border border-gray-200/80 dark:border-white/10
                 rounded-2xl p-6"
        >
          <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">
            Specializations
          </h3>
          <ul class="space-y-2" role="list">
            @for (item of specializations; track item) {
              <li class="flex items-start gap-2 text-sm text-gray-600 dark:text-gray-300">
                <span class="text-indigo-500 mt-0.5" aria-hidden="true">▸</span>
                {{ item }}
              </li>
            }
          </ul>
        </div>
      </div>
    </div>

    <!-- Mission -->
    <div
      appScrollReveal
      [delay]="400"
      class="mt-8 bg-gradient-to-r from-indigo-500/10 to-cyan-500/10
             border border-indigo-500/20 dark:border-indigo-500/30
             rounded-2xl p-6 sm:p-8"
    >
      <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-3">
        Mission &amp; Passion
      </h3>
      <p class="text-gray-600 dark:text-gray-300 leading-relaxed italic">
        "{{ mission }}"
      </p>
    </div>
  </div>
</section>
