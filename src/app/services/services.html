<section
  id="services"
  class="py-20 md:py-28 px-4 sm:px-6 bg-white dark:bg-gray-950 relative overflow-hidden"
>
  <div
    class="absolute -top-20 -left-20 w-[400px] h-[400px]
           bg-gradient-to-r from-indigo-500/10 to-cyan-500/10 blur-[150px] rounded-full animate-pulse-slow"
    aria-hidden="true"
  ></div>

  <div class="relative max-w-6xl mx-auto">
    <div appScrollReveal>
      <app-section-header
        title="My "
        highlight="Services"
        subtitle="Solutions tailored to your business needs"
      />
    </div>

    <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (service of services; track service.title; let i = $index) {
        <div
          appScrollReveal
          [delay]="i * 80"
          class="group relative bg-white/70 dark:bg-white/5 backdrop-blur-xl
                 border border-gray-200/80 dark:border-white/10
                 rounded-2xl p-8 text-center transition transform duration-500
                 hover:-translate-y-3 hover:shadow-2xl hover:shadow-indigo-500/10
                 hover:border-indigo-500/30"
        >
          <div
            class="mx-auto mb-6 h-16 w-16 rounded-full bg-gradient-to-r from-indigo-500 to-cyan-500
                   flex items-center justify-center text-2xl shadow-md
                   group-hover:scale-110 transition-transform duration-300"
            aria-hidden="true"
          >
            {{ service.icon }}
          </div>

          <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-3">
            {{ service.title }}
          </h3>
          <p class="text-gray-600 dark:text-gray-300 text-sm leading-relaxed">
            {{ service.description }}
          </p>
        </div>
      }
    </div>
  </div>
</section>
