<section
  id="skills"
  class="relative py-20 md:py-28 px-4 sm:px-6 bg-white dark:bg-gray-950 overflow-hidden"
>
  <div
    class="absolute top-0 right-0 w-96 h-96 bg-indigo-500/10 blur-3xl rounded-full"
    aria-hidden="true"
  ></div>

  <div class="relative max-w-6xl mx-auto">
    <div appScrollReveal>
      <app-section-header
        title="Skills & "
        highlight="Technologies"
        subtitle="Expertise across the full development stack"
      />
    </div>

    <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (category of categories; track category.name; let i = $index) {
        <div
          appScrollReveal
          [delay]="i * 80"
          class="group bg-white/70 dark:bg-white/5 backdrop-blur-lg
                 border border-gray-200/80 dark:border-white/10
                 rounded-2xl p-6 transition duration-500
                 hover:-translate-y-2 hover:border-indigo-500/40
                 hover:shadow-xl hover:shadow-indigo-500/10"
        >
          <div class="flex items-center gap-3 mb-5">
            <span class="text-2xl" aria-hidden="true">{{ category.icon }}</span>
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
              {{ category.name }}
            </h3>
          </div>

          <div class="space-y-4">
            @for (skill of category.skills; track skill.name) {
              <div>
                <div class="flex items-center justify-between mb-1.5">
                  <div class="flex items-center gap-2">
                    @if (skill.logo) {
                      <app-themed-logo
                        [light]="skill.logo"
                        [dark]="skill.logoDark"
                        [size]="20"
                        imgClass="w-5 h-5 object-contain"
                      />
                    }
                    <span class="text-sm text-gray-600 dark:text-gray-300 group-hover:text-gray-900 dark:group-hover:text-white transition">
                      {{ skill.name }}
                    </span>
                  </div>
                  <span class="text-xs text-indigo-500 dark:text-indigo-400 font-medium">
                    {{ skill.level }}%
                  </span>
                </div>
                <div
                  class="h-1.5 rounded-full bg-gray-200 dark:bg-gray-800 overflow-hidden"
                  role="progressbar"
                  [attr.aria-valuenow]="skill.level"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  [attr.aria-label]="skill.name + ' proficiency'"
                >
                  <div
                    class="h-full rounded-full bg-gradient-to-r from-indigo-500 to-cyan-500 transition-all duration-1000"
                    [style.width.%]="skill.level"
                  ></div>
                </div>
              </div>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
