<section
  id="hero"
  class="relative min-h-screen flex items-center justify-center
         bg-gradient-to-br from-gray-100 via-white to-gray-50
         dark:from-gray-950 dark:via-gray-900 dark:to-black
         text-gray-900 dark:text-white overflow-hidden px-4 sm:px-6 pt-16"
>
  <!-- Background Glow Effects -->
  <div
    class="absolute top-0 left-0 w-48 h-48 sm:w-72 sm:h-72 bg-indigo-500/20 rounded-full blur-3xl animate-floaty"
    aria-hidden="true"
  ></div>
  <div
    class="absolute bottom-0 right-0 w-48 h-48 sm:w-72 sm:h-72 bg-cyan-500/20 rounded-full blur-3xl animate-floaty-reverse"
    aria-hidden="true"
  ></div>

  <!-- Animated Background Layers -->
  <div class="absolute inset-0 z-0 pointer-events-none" aria-hidden="true">
    <div
      class="absolute -inset-[10%] opacity-90 pointer-events-none animate-bg-shift-a
             bg-[radial-gradient(45%_40%_at_10%_20%,rgba(99,102,241,0.14),transparent_18%),radial-gradient(30%_30%_at_80%_80%,rgba(6,182,212,0.10),transparent_22%)]
             blur-[60px] saturate-[1.2]"
    ></div>
    <div
      class="absolute -inset-[20%] opacity-55 pointer-events-none animate-bg-shift-b
             bg-[conic-gradient(from_180deg_at_50%_50%,rgba(99,102,241,0.04),rgba(6,182,212,0.04),rgba(125,211,252,0.02))]
             blur-[80px] saturate-[1.2]"
    ></div>
  </div>

  <!-- Dot grid overlay -->
  <div
    class="absolute inset-0 z-0 pointer-events-none
           bg-[radial-gradient(rgba(148,163,184,0.06)_1px,transparent_1px)]
           bg-[length:36px_36px] dark:bg-[radial-gradient(rgba(148,163,184,0.06)_1px,transparent_1px)]"
    aria-hidden="true"
  ></div>

  <div class="relative z-10 max-w-5xl w-full text-center py-10 sm:py-0">
    <!-- Glassy card -->
    <div
      class="relative rounded-2xl sm:rounded-3xl px-4 py-10 sm:px-10 sm:py-14 md:px-14
             bg-white/60 dark:bg-white/[0.03] backdrop-blur-sm
             border border-gray-200/80 dark:border-white/[0.07]
             shadow-[0_0_0_1px_rgba(56,189,248,0.05),0_32px_80px_rgba(0,0,0,0.12)]
             dark:shadow-[0_0_0_1px_rgba(56,189,248,0.05),0_32px_80px_rgba(0,0,0,0.55)]"
    >
      <!-- Top edge glow line -->
      <div
        class="absolute top-0 left-[15%] right-[15%] h-px rounded-full
               bg-gradient-to-r from-transparent via-sky-400/40 to-transparent"
        aria-hidden="true"
      ></div>

      <!-- Profile Image -->
      <div class="relative inline-flex items-center justify-center mb-8 sm:mb-10">
        <!-- Spinning orbit ring -->
        <div
          class="absolute w-40 h-40 sm:w-52 sm:h-52 md:w-64 md:h-64 rounded-full animate-spin-slow
                 border border-white/10 dark:border-white/[0.08]
                 bg-[conic-gradient(from_0deg,rgba(99,102,241,0.15),rgba(34,211,238,0.15),transparent_60%)]"
          aria-hidden="true"
        ></div>

        <!-- Animated Gradient Glow Ring -->
        <div
          class="absolute w-36 h-36 sm:w-44 sm:h-44 md:w-60 md:h-60
                 bg-gradient-to-r from-indigo-500 to-cyan-500
                 rounded-full blur-3xl opacity-25 animate-pulse"
          aria-hidden="true"
        ></div>

        <img
          [ngSrc]="personal.profileImage"
          [alt]="personal.name + ' profile picture'"
          width="224"
          height="224"
          priority
          class="relative rounded-full object-cover w-32 h-32 xs:w-36 xs:h-36 sm:w-44 sm:h-44 md:w-56 md:h-56
                 border-4 border-white/60 dark:border-white/10
                 shadow-2xl ring-2 ring-indigo-500/30
                 transition-transform duration-500 hover:scale-105 hover:shadow-indigo-500/30"
        />
      </div>

      <!-- Greeting -->
      <p
        class="mb-3 sm:mb-4 text-2xl sm:text-3xl md:text-4xl font-bold text-sky-500 dark:text-sky-400 tracking-wide animate-fade-in-down"
      >
        <span class="inline-block origin-[70%_70%] animate-wave" aria-hidden="true">👋</span>
        {{ greeting() }}
      </p>

      <!-- Name -->
      <div class="relative inline-block mb-2 max-w-full">
        <h1
          class="text-3xl sm:text-5xl md:text-6xl font-extrabold tracking-tight
                 bg-gradient-to-r from-gray-900 to-gray-600 dark:from-white dark:to-gray-300
                 bg-clip-text text-transparent animate-pop leading-tight break-words"
        >
          {{ personal.name }}
        </h1>
        <span
          class="absolute -bottom-1 left-0 right-0 h-[3px] rounded-full block
                 bg-gradient-to-r from-indigo-500 to-cyan-500 scale-x-0 origin-left animate-line-reveal"
          aria-hidden="true"
        ></span>
      </div>

      <!-- Title -->
      <p class="text-sm sm:text-lg md:text-2xl text-gray-600 dark:text-gray-300 mb-2 font-medium mt-4 leading-snug">
        {{ personal.title }}
        <span class="hidden sm:inline text-sky-400/40 mx-1">|</span>
        <br class="sm:hidden" />
        {{ personal.subtitle }}
      </p>

      <!-- Tagline -->
      <p
        class="max-w-2xl mx-auto text-gray-500 dark:text-gray-400 text-sm sm:text-base md:text-lg leading-relaxed mb-8 sm:mb-10 animate-fade-in-up"
      >
        {{ personal.tagline }}
      </p>

      <!-- CTA Buttons -->
      <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 justify-center mb-10 sm:mb-12">
        <a
          [href]="personal.resumeUrl"
          download
          class="relative overflow-hidden px-6 sm:px-8 py-3 rounded-full
                 bg-gradient-to-r from-indigo-500 to-cyan-500
                 hover:from-indigo-400 hover:to-cyan-400 text-white
                 font-semibold shadow-lg text-sm sm:text-base
                 hover:-translate-y-1 hover:shadow-indigo-400/40
                 transition-all duration-300 group focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2"
        >
          <span
            class="absolute inset-0 -translate-x-full group-hover:translate-x-full
                   transition-transform duration-700
                   bg-gradient-to-r from-transparent via-white/20 to-transparent"
            aria-hidden="true"
          ></span>
          Download Resume
        </a>

        <a
          href="#projects"
          class="px-6 sm:px-8 py-3 rounded-full
                 border border-gray-300 dark:border-white/20
                 hover:bg-gray-100 dark:hover:bg-white/10 hover:border-sky-400/30 hover:-translate-y-1
                 transition-all duration-300 font-semibold text-sm sm:text-base
                 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2"
        >
          View Projects
        </a>

        <a
          href="#contact"
          class="px-6 sm:px-8 py-3 rounded-full
                 border border-gray-300 dark:border-white/20
                 hover:bg-gray-100 dark:hover:bg-white/10 hover:border-sky-400/30 hover:-translate-y-1
                 transition-all duration-300 font-semibold text-sm sm:text-base
                 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2"
        >
          Contact Me
        </a>
      </div>

      <!-- Stats -->
      <div class="flex flex-wrap justify-center gap-8 sm:gap-12 pt-6 border-t border-gray-200/60 dark:border-white/10">
        @for (stat of stats; track stat.label) {
          <app-stat-counter
            [value]="stat.value"
            [label]="stat.label"
            [suffix]="stat.suffix ?? ''"
          />
        }
      </div>

      <!-- Bottom edge line -->
      <div
        class="absolute bottom-0 left-[15%] right-[15%] h-px rounded-full
               bg-gradient-to-r from-transparent via-gray-300/30 dark:via-white/5 to-transparent"
        aria-hidden="true"
      ></div>
    </div>
  </div>
</section>
